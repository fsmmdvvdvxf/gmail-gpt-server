<!-- header.html — client-side include. Brand binds from business.json; nav is
     written from pages[] (manifest known at build time). -->
<header class="hd" data-header>
  <div class="bar">
    <a class="brand" href="index.html" aria-label="Nicole Fields Photography — home">
      <b data-field="name">Nicole Fields</b>
      <span>Photography</span>
    </a>
    <nav class="pn" aria-label="Primary">
      <ul class="nav-links">
        <li><a href="index.html" data-nav="home">Home</a></li>
        <li><a href="portfolio.html" data-nav="portfolio">Portfolio</a></li>
        <li><a href="about.html" data-nav="about">About</a></li>
        <li><a href="services.html" data-nav="services">Services</a></li>
        <li><a href="contact.html" data-nav="contact">Contact</a></li>
      </ul>
      <button class="tt" data-theme-toggle aria-label="Toggle light and dark theme">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="burger" data-burger aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </nav>
  </div>
</header>
