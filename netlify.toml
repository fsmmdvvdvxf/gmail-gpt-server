# Root Netlify config — makes this repo one-click deployable.
#
# The website lives in site/. With base = "site", all other paths below
# resolve relative to that folder (publish -> site/, functions ->
# site/netlify/functions). These values intentionally match
# site/netlify.toml so a `netlify deploy` run from inside site/ and a
# Git-connected deploy from the repo root behave identically.
#
# Connect in the Netlify UI: Add new site -> Import from GitHub -> pick this
# repo. Base/publish are picked up from here automatically; no build step.

[build]
  base = "site"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200

# Security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
